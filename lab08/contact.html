<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="skills.html">Skills</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h1>Contact Me</h1>

        <!-- First Row: Address and Contact Information -->
        <div class="row1">

            <div class="column">
                <h2>Mailing Address</h2>

                <p>Peniel Srithas</p>

                <address>
                    Syracuse University<br>
                    Syracuse, NY 13244
                </address>
            </div>

            <div class="column">
                <h2>Contact Information</h2>

                <p>
                    <a href="mailto:psrithas@syr.edu">
                        Email Me
                    </a>
                </p>

                <p>
                    <a href="https://www.linkedin.com/in/penielsrithas/" target="_blank" rel="noopener noreferrer">
                        My LinkedIn Profile
                        <img class="linkedin-logo" src="../images/logo.size.png" alt="LinkedIn logo">
                    </a>
                </p>
            </div>

        </div>

        <!-- Second Row: Contact Form and Google Map -->
        <div class="row2">

            <div class="column">
                <h2>Contact Form</h2>

                <form action="https://formspree.io/f/xrpbjrkj" method="post">

                    <p>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                    </p>

                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </p>

                    <fieldset>
                        <legend>Reason for Contact:</legend>

                        <input type="radio" id="school" name="reason" value="school">
                        <label for="school">School</label>

                        <input type="radio" id="professional" name="reason" value="professional">
                        <label for="professional">Professional</label>

                        <input type="radio" id="other" name="reason" value="other">
                        <label for="other">Other</label>
                    </fieldset>

                    <p>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message"></textarea>
                    </p>

                    <input type="submit" value="Send">

                </form>
            </div>

            <div class="column">
                <h2>My Location</h2>

                <iframe
                    title="Map showing Syracuse University"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2916.1320014030375!2d-76.13626712349445!3d43.038654091959984!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d9f39fba2ccc55%3A0x5e6089065251084d!2sSyracuse%20University!5e0!3m2!1sen!2sus!4v1790646126822!5m2!1sen!2sus"
                    width="600"
                    height="450"
                    style="border:0;"
                    allowfullscreen
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

        </div>
    </main>

</body>
</html>
